openapi: 3.1.0
info:
  title: Power Monitor central server device API
  version: 1.0.0
  description: Current pm-protocol/1.0.0 wire contract implemented by the Power Monitor Server.
servers:
  - url: https://power-monitor-server.example
paths:
  /api/v1/device-enrollment/claim:
    post:
      operationId: claimEnrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollmentClaim'}
      responses:
        '201':
          description: Unique device credentials and effective policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-heartbeats:
    post:
      operationId: postHeartbeat
      security: [{deviceHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Heartbeat'}
      responses:
        '200':
          description: Heartbeat acknowledgement and synchronization policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeartbeatResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-readings/batch:
    post:
      operationId: postReadingBatch
      security: [{deviceHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadingBatch'}
      responses:
        '200':
          description: Idempotent contiguous acknowledgement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReadingBatchResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-events/batch:
    post:
      operationId: postEventBatch
      security: [{deviceHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventBatch'}
      responses:
        '200': {description: Events accepted idempotently}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-config/effective:
    get:
      operationId: getEffectiveConfig
      security: [{deviceHmac: []}]
      responses:
        '200':
          description: Desired server configuration version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveConfig'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-config/report:
    post:
      operationId: reportConfigResult
      security: [{deviceHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigReport'}
      responses:
        '200': {description: Report recorded}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-firmware/manifest:
    get:
      operationId: getFirmwareManifest
      security: [{deviceHmac: []}]
      responses:
        '200':
          description: Update availability or a device-specific HMAC-authenticated v2 manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirmwareManifest'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-firmware/{release_id}/download:
    get:
      operationId: downloadFirmware
      description: Download the exact binary referenced by an authenticated signed manifest. The response Digest header and signed sha256 field cover the same bytes.
      security: [{deviceHmac: []}]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: deployment_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Firmware application image
          headers:
            Digest:
              description: Base64 SHA-256 digest in RFC 3230 form.
              schema: {type: string, pattern: '^SHA-256=[A-Za-z0-9+/]+={0,2}$'}
          content:
            application/octet-stream:
              schema: {type: string, contentEncoding: binary}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/device-firmware/report:
    post:
      operationId: reportFirmwareDeploymentState
      security: [{deviceHmac: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirmwareReport'}
      responses:
        '200': {description: Idempotent deployment milestone recorded}
        '204': {description: Idempotent deployment milestone recorded}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    deviceHmac:
      type: apiKey
      in: header
      name: X-PM-Signature
      description: Complete X-PM-* header set using the device-to-server HKDF key.
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
    DeviceCapabilities:
      type: object
      required: [hardware_target, pzem_model, sd_present, sd_required, supported_endpoints]
      properties:
        hardware_target: {type: string}
        pzem_model: {type: string, pattern: '^PZEM-004T V4'}
        sd_present: {type: boolean}
        sd_required: {const: true}
        ota: {$ref: '#/components/schemas/OtaCapability'}
        supported_endpoints:
          type: array
          items: {type: string}
    OtaCapability:
      type: object
      additionalProperties: false
      required: [supported, protocol_version, authentication_mode, rollback_supported, partition_size_bytes]
      properties:
        supported: {const: true}
        protocol_version: {const: 2}
        authentication_mode: {const: existing_device_hmac}
        rollback_supported: {type: boolean}
        partition_size_bytes: {type: integer, minimum: 1, maximum: 6291456}
    EnrollmentClaim:
      type: object
      required: [token, protocol_version, hardware_id, capabilities]
      properties:
        token: {type: string, minLength: 32, maxLength: 256}
        protocol_version: {const: pm-protocol/1.0.0}
        hardware_id: {type: string, minLength: 8, maxLength: 128}
        requested_name: {type: [string, 'null'], maxLength: 160}
        capabilities: {$ref: '#/components/schemas/DeviceCapabilities'}
    EnrollmentResponse:
      type: object
      required: [protocol_version, device_id, enrollment_secret, credential_fingerprint, effective_metadata, heartbeat_policy, sync_policy]
      properties:
        protocol_version: {const: pm-protocol/1.0.0}
        device_id: {type: string, format: uuid}
        enrollment_secret:
          type: string
          description: High-entropy URL-safe secret returned exactly once and stored as UTF-8 bytes.
        credential_fingerprint: {type: string}
        effective_metadata: {type: object}
        server_ota_signing_public_key: {type: [string, 'null']}
        heartbeat_policy: {type: object}
        sync_policy:
          type: object
          additionalProperties: false
          required: [maximum_batch_records, durable_interval_seconds, data_generation, reset_boundary]
          properties:
            maximum_batch_records: {type: integer, minimum: 1, maximum: 10000}
            durable_interval_seconds: {type: integer, minimum: 10, maximum: 3600}
            data_generation: {type: integer, minimum: 0, maximum: 9223372036854775806}
            reset_boundary: {type: integer, minimum: 0, maximum: 9223372036854775806}
    SubsystemHealth:
      type: object
      required: [ok, status]
      properties:
        ok: {type: boolean}
        status: {type: string}
        error_count: {type: integer, minimum: 0}
        details: {type: object}
      additionalProperties: true
    StorageHealthDetails:
      type: object
      properties:
        history_integrity_verified: {type: [boolean, 'null']}
        reading_index_integrity_verified: {type: [boolean, 'null']}
        event_log_integrity_verified: {type: [boolean, 'null']}
        event_log_integrity_status:
          type: [string, 'null']
          enum: [verified, not_scanned, unavailable, event_record_corruption_detected, event_log_open_failed, null]
      additionalProperties: true
    StorageSubsystemHealth:
      type: object
      required: [ok, status]
      properties:
        ok: {type: boolean}
        status: {type: string}
        error_count: {type: integer, minimum: 0}
        details: {$ref: '#/components/schemas/StorageHealthDetails'}
      additionalProperties: true
    TimeHealth:
      type: object
      required: [trusted, source]
      properties:
        trusted: {type: boolean}
        source: {type: string}
        offset_ms: {type: [integer, 'null']}
        last_sync_at: {type: [string, 'null'], format: date-time}
    LiveMeasurement:
      type: object
      required: [measured_at, voltage_v, current_a, power_w, power_factor, frequency_hz, energy_wh]
      properties:
        measured_at: {type: string, format: date-time}
        voltage_v: {type: number, minimum: 0, maximum: 400}
        current_a: {type: number, minimum: 0, maximum: 5000}
        power_w: {type: number, minimum: 0}
        power_factor: {type: number, minimum: 0, maximum: 1}
        frequency_hz: {type: number, minimum: 40, maximum: 70}
        energy_wh: {type: number, minimum: 0}
    Heartbeat:
      type: object
      required: [protocol_version, schema_version, device_id, boot_id, firmware_version, firmware_build_hash, uptime_seconds, reboot_reason, connection_mode, pzem, sd, oldest_stored_sequence, newest_stored_sequence, server_ack_sequence, backlog_estimate, configuration_version, time, resources, queue]
      properties:
        protocol_version: {const: pm-protocol/1.0.0}
        schema_version: {const: heartbeat/1.0.0}
        device_id: {type: string, format: uuid}
        boot_id: {type: string, format: uuid}
        firmware_version: {type: string}
        firmware_build_hash: {type: string}
        data_generation:
          type: integer
          minimum: 0
          default: 0
          description: Additive data-only-reset epoch; omission means generation zero for legacy sensors.
        ota: {$ref: '#/components/schemas/OtaCapability'}
        uptime_seconds: {type: integer, minimum: 0}
        reboot_reason: {type: string}
        current_ip: {type: [string, 'null']}
        hostname: {type: [string, 'null']}
        rssi_dbm: {type: [integer, 'null'], minimum: -127, maximum: 0}
        connection_mode: {enum: [pull, push, hybrid], description: v1 preserves all values; current sensor firmware emits push and fails closed for pull or hybrid configuration.}
        latest:
          oneOf:
            - {$ref: '#/components/schemas/LiveMeasurement'}
            - {type: 'null'}
        pzem: {$ref: '#/components/schemas/SubsystemHealth'}
        sd: {$ref: '#/components/schemas/StorageSubsystemHealth'}
        oldest_stored_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
        oldest_syncable_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807, description: Oldest retained durable interval with trustworthy UTC bounds that can be synchronized.}
        newest_syncable_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
        newest_stored_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
        server_ack_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
        server_maximum_seen_sequence: {type: integer, minimum: 0, maximum: 9223372036854775807}
        backlog_estimate: {type: integer, minimum: 0}
        configuration_version: {type: integer, minimum: 0}
        time: {$ref: '#/components/schemas/TimeHealth'}
        resources:
          type: object
          description: Runtime resource evidence. ota_recovery.evidence_sequence is an optional unsigned, per-deployment-attempt monotonic OTA evidence counter emitted by current firmware.
          properties:
            ota_recovery:
              type: object
              properties:
                deployment_id: {type: string, format: uuid}
                attempt: {type: integer, minimum: 1}
                evidence_sequence:
                  type: integer
                  minimum: 0
                  maximum: 18446744073709551615
                  description: Latest durably persisted OTA evidence sequence for the active deployment attempt.
              dependentRequired:
                evidence_sequence: [deployment_id, attempt]
                deployment_id: [attempt, evidence_sequence]
                attempt: [deployment_id, evidence_sequence]
              additionalProperties: true
          additionalProperties: true
        queue: {type: object}
        data_reset:
          type: object
          required: [protocol, state, checkpoint]
          properties:
            protocol: {const: data-reset/1.0.0}
            state: {type: string, minLength: 1, maxLength: 48}
            checkpoint: {type: string, minLength: 1, maxLength: 48}
            failure_code: {type: [string, 'null'], maxLength: 80, pattern: '^[a-z0-9][a-z0-9_]{0,79}$'}
            operation_id: {type: [string, 'null'], format: uuid}
            target_generation: {type: [integer, 'null'], minimum: 1}
            reset_boundary: {type: [integer, 'null'], minimum: 0, maximum: 9223372036854775805}
            reset_required: {type: boolean, default: false}
          additionalProperties: true
    HeartbeatResponse:
      type: object
      required: [server_receive_time, highest_contiguous_accepted_sequence, gap_ranges, desired_configuration_version, firmware_release_available, recommended_heartbeat_interval_seconds, immediate_sync_requested]
      properties:
        server_receive_time: {type: string, format: date-time}
        highest_contiguous_accepted_sequence: {type: integer, minimum: 0}
        gap_ranges: {type: array}
        desired_configuration_version: {type: integer, minimum: 0}
        firmware_release_available: {type: boolean}
        recommended_heartbeat_interval_seconds: {type: integer}
        immediate_sync_requested: {type: boolean}
    Reading:
      type: object
      required: [sequence, boot_id, interval_start, interval_end, time_trusted, energy_method, ct_rating_amps, quality_flags, firmware_version]
      properties:
        data_generation:
          type: integer
          minimum: 0
          default: 0
          description: Additive data-only-reset epoch; omission means generation zero for legacy sensors.
        sequence: {type: integer, minimum: 1, maximum: 9223372036854775807}
        boot_id: {type: string}
        interval_start: {type: string, format: date-time}
        interval_end: {type: string, format: date-time}
        time_trusted: {type: boolean}
        voltage_avg: {type: [number, 'null'], minimum: 0, maximum: 400}
        voltage_min: {type: [number, 'null'], minimum: 0, maximum: 400}
        voltage_max: {type: [number, 'null'], minimum: 0, maximum: 400}
        current_avg: {type: [number, 'null'], minimum: 0, maximum: 5000}
        current_min: {type: [number, 'null'], minimum: 0, maximum: 5000}
        current_max: {type: [number, 'null'], minimum: 0, maximum: 5000}
        power_avg: {type: [number, 'null'], minimum: 0, maximum: 10000000}
        power_min: {type: [number, 'null'], minimum: 0, maximum: 10000000}
        power_max: {type: [number, 'null'], minimum: 0, maximum: 10000000}
        power_factor: {type: [number, 'null'], minimum: 0, maximum: 1}
        frequency_hz: {type: [number, 'null'], minimum: 40, maximum: 70}
        pzem_energy_start_wh: {type: [number, 'null'], minimum: 0}
        pzem_energy_end_wh: {type: [number, 'null'], minimum: 0}
        device_lifetime_energy_wh: {type: [number, 'null'], minimum: 0}
        interval_energy_wh: {type: [number, 'null'], minimum: 0}
        energy_method: {type: string, maxLength: 40}
        ct_rating_amps: {type: number, exclusiveMinimum: 0}
        quality_flags:
          type: array
          items: {type: string}
        firmware_version: {type: string}
        record_hash: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
    ReadingBatch:
      type: object
      required: [protocol_version, schema_version, device_id, readings]
      properties:
        protocol_version: {const: pm-protocol/1.0.0}
        schema_version: {const: reading-batch/1.0.0}
        device_id: {type: string, format: uuid}
        data_generation:
          type: integer
          minimum: 0
          default: 0
        readings:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/Reading'}
        unavailable_sequence_ranges:
          type: array
          maxItems: 500
          description: HMAC-signed retained sequence ranges that cannot be synchronized because their UTC interval was never trustworthy. They remain immutable on the sensor and are never converted into fabricated readings.
          items:
            type: object
            required: [start_sequence, end_sequence]
            additionalProperties: false
            properties:
              start_sequence: {type: integer, minimum: 1}
              end_sequence: {type: integer, minimum: 1}
    ReadingBatchResponse:
      type: object
      required: [accepted, duplicates, rejected, highest_contiguous_accepted_sequence, missing_ranges]
      properties:
        accepted: {type: array, items: {type: integer}}
        duplicates: {type: array, items: {type: integer}}
        rejected: {type: array}
        highest_contiguous_accepted_sequence: {type: integer, minimum: 0}
        missing_ranges: {type: array}
    Event:
      type: object
      required: [event_id, occurred_at, category, severity, evidence]
      properties:
        event_id: {type: string, minLength: 1, maxLength: 80}
        occurred_at: {type: string, format: date-time}
        category: {enum: [boot, pzem, ct_limit, sd, network, time, configuration, ota, security]}
        severity: {enum: [info, warning, error, critical]}
        evidence: {type: object}
    EventBatch:
      type: object
      required: [protocol_version, device_id, data_generation, events]
      properties:
        protocol_version: {const: pm-protocol/1.0.0}
        device_id: {type: string, format: uuid}
        data_generation: {type: integer, minimum: 0}
        events:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/Event'}
    EffectiveConfig:
      type: object
      required: [protocol_version, device_id, version, settings, sha256]
      properties:
        protocol_version: {const: pm-protocol/1.0.0}
        device_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        settings: {type: object}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    ConfigReport:
      type: object
      required: [protocol_version, device_id, version, status, applied, rejected]
      properties:
        protocol_version: {const: pm-protocol/1.0.0}
        device_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {enum: [applied, partially_applied, rejected, rolled_back]}
        applied: {type: array, items: {type: string}}
        rejected: {type: object}
    FirmwareManifest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [available, protocol_version]
          properties:
            available: {const: false}
            protocol_version: {const: pm-protocol/1.0.0}
        - type: object
          additionalProperties: false
          required: [schema_version, protocol_version, deployment_id, release_id, device_id, version, project_name, hardware_target, protocol_min, protocol_max, size_bytes, sha256, build_hash, not_before, expires_at, allow_downgrade, attempt, hmac_algorithm, hmac_key_context, download_path, manifest_hmac]
          properties:
            schema_version: {const: pm-ota-manifest/2}
            protocol_version: {const: pm-protocol/1.0.0}
            deployment_id: {type: string, format: uuid}
            release_id: {type: string, format: uuid}
            device_id: {type: string, format: uuid}
            version: {type: string, minLength: 5, maxLength: 80}
            project_name: {const: power-monitor-sensor}
            hardware_target: {const: esp32-s3}
            protocol_min: {const: pm-protocol/1.0.0}
            protocol_max: {const: pm-protocol/1.0.0}
            size_bytes: {type: integer, minimum: 1, maximum: 6291456}
            sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            build_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
            not_before: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
            allow_downgrade: {type: boolean}
            attempt: {type: integer, minimum: 1}
            hmac_algorithm: {const: HMAC-SHA256}
            hmac_key_context: {const: pm-ota-manifest-v2/server-to-device}
            download_path:
              type: string
              pattern: '^/api/v1/device-firmware/[0-9a-f-]{36}/download\?deployment_id=[0-9a-f-]{36}$'
            manifest_hmac: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    FirmwareReport:
      type: object
      additionalProperties: false
      required: [device_id, deployment_id, release_id, attempt, state, current_firmware_version, current_build_hash, target_version, target_sha256, bytes_received, image_size, progress, boot_id, failure_code, failure_summary]
      properties:
        device_id: {type: string, format: uuid}
        deployment_id: {type: string, format: uuid}
        release_id: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1}
        state:
          type: string
          enum: [manifest_authenticated, waiting_for_schedule, download_started, downloading, binary_verified, partition_written, rebooting, post_boot_validation, validated, failed, rollback_detected, rolled_back]
        evidence_sequence:
          type: integer
          minimum: 0
          description: Optional monotonic OTA evidence sequence. Legacy firmware may omit it; retries of the same durable evidence retain the same value.
        current_firmware_version: {type: string, minLength: 1, maxLength: 80}
        current_build_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        target_version: {type: string, minLength: 1, maxLength: 80}
        target_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        bytes_received: {type: integer, minimum: 0}
        image_size: {type: integer, minimum: 1, maximum: 6291456}
        progress: {type: integer, minimum: 0, maximum: 100}
        boot_id: {type: string, format: uuid}
        failure_code: {type: [string, 'null'], pattern: '^[a-z0-9][a-z0-9_]{0,79}$'}
        failure_summary: {type: [string, 'null'], maxLength: 256}
