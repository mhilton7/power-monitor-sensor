[platformio]
default_envs = esp32-s3-release
src_dir = src
include_dir = include

[common]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters =
  time
  esp32_exception_decoder
extra_scripts =
  pre:tools/build_metadata.py
  post:tools/patch_app_descriptor.py
  post:tools/relocate_ota_selector.py
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.offset_address = 0x20000
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  ESP32Async/AsyncTCP@3.4.10
  ESP32Async/ESPAsyncWebServer@3.11.2
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
  -Werror=return-type
  -Werror=uninitialized
  -Werror=maybe-uninitialized
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPM_FIRMWARE_VERSION=\"1.0.12\"
  -DPM_PROTOCOL_VERSION=\"pm-protocol/1.0.0\"

[env:esp32-s3-release]
extends = common
build_type = release
build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=0
  -DPM_SERIAL_LOG_LEVEL=2
  -DPM_SERIAL_TRACE_ENABLED=0
  -DPM_RELEASE_BUILD=1
  -DPM_SIMULATED_METER=0
  -DPM_PHYSICAL_ADMIN_RECOVERY=0

[env:esp32-s3-debug]
extends = common
build_type = debug
build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DPM_SERIAL_LOG_LEVEL=1
  -DPM_SERIAL_TRACE_ENABLED=1
  -DPM_RELEASE_BUILD=0
  -DPM_SIMULATED_METER=0
  -DPM_PHYSICAL_ADMIN_RECOVERY=0

[env:esp32-s3-simulated-meter]
extends = common
build_type = debug
build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=3
  -DPM_SERIAL_LOG_LEVEL=1
  -DPM_SERIAL_TRACE_ENABLED=1
  -DPM_RELEASE_BUILD=0
  -DPM_SIMULATED_METER=1
  -DPM_PHYSICAL_ADMIN_RECOVERY=0

[env:esp32-s3-admin-recovery]
extends = common
build_type = release
build_flags =
  ${common.build_flags}
  -DCORE_DEBUG_LEVEL=0
  -DPM_SERIAL_LOG_LEVEL=2
  -DPM_SERIAL_TRACE_ENABLED=0
  -DPM_RELEASE_BUILD=0
  -DPM_SIMULATED_METER=0
  -DPM_PHYSICAL_ADMIN_RECOVERY=1

[env:native-tests]
platform = native@1.2.1
platform_packages =
  platformio/toolchain-gccmingw32@1.50100.0
extra_scripts = pre:tools/native_toolchain.py
lib_deps =
  bblanchon/ArduinoJson@7.4.3
test_build_src = true
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror
  -static
  -static-libgcc
  -static-libstdc++
  -DPM_NATIVE_TEST=1
build_src_filter =
  +<native_test_runner.cpp>
  +<config/AtomicConfigStore.cpp>
  +<config/ConfigValidationHelpers.cpp>
  +<config/ProvisioningTransaction.cpp>
  +<meter/PzemProtocol.cpp>
  +<core/Algorithms.cpp>
  +<api/CompactUiStatus.cpp>
  +<diagnostics/DiagnosticCore.cpp>
  +<network/ReadingWireFormat.cpp>
  +<network/ServerSyncPolicy.cpp>
  +<ota/OtaManifestV2.cpp>
  +<ota/OtaUpdatePolicy.cpp>
  +<storage/RecordFormat.cpp>
  +<storage/StoragePolicy.cpp>

[env:native-sanitized]
platform = native@1.2.1
platform_packages =
  platformio/toolchain-gccmingw32@1.50100.0
extra_scripts =
  pre:tools/native_toolchain.py
  pre:tools/native_sanitizers.py
lib_deps =
  bblanchon/ArduinoJson@7.4.3
test_build_src = true
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror
  -static
  -static-libgcc
  -static-libstdc++
  -DPM_NATIVE_TEST=1
build_src_filter =
  +<native_test_runner.cpp>
  +<config/AtomicConfigStore.cpp>
  +<config/ConfigValidationHelpers.cpp>
  +<config/ProvisioningTransaction.cpp>
  +<meter/PzemProtocol.cpp>
  +<core/Algorithms.cpp>
  +<api/CompactUiStatus.cpp>
  +<diagnostics/DiagnosticCore.cpp>
  +<network/ReadingWireFormat.cpp>
  +<network/ServerSyncPolicy.cpp>
  +<ota/OtaManifestV2.cpp>
  +<ota/OtaUpdatePolicy.cpp>
  +<storage/RecordFormat.cpp>
  +<storage/StoragePolicy.cpp>
